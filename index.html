<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>neen — The Quiet Laws of Us</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        background-color: #ffffff;
      }

      body {
        background-color: transparent;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: "Nunito Sans", sans-serif;
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          linear-gradient(rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.5)),
          url("background.jpg") center/cover no-repeat;
      }

      /* BANNIÈRE */
      .banner {
        position: relative;
        width: calc(100% - 2rem);
        max-width: 520px;
        height: 360px;
        overflow: hidden;
        flex-shrink: 0;
        margin-top: 1.5rem;
        border-radius: 28px;
      }

      .banner-photo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 15%;
        display: block;
      }

      .banner-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(58, 80, 121, 0.1) 0%,
          rgba(58, 80, 121, 0.15) 50%,
          rgba(58, 80, 121, 0.75) 100%
        );
      }

      .banner-logo {
        position: absolute;
        bottom: 0.5rem;
        left: 50%;
        transform: translateX(-50%);
        width: 225px;
        mix-blend-mode: screen;
      }

      /* CONTENU */
      .card {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 600px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.75rem;
        padding: 2rem 2rem 3rem;
      }

      .bio {
        font-family: "Nunito Sans", sans-serif;
        font-size: 1.05rem;
        font-weight: 600;
        color: #3a5079;
        text-align: center;
        line-height: 1.6;
        max-width: 520px;
      }

      .links {
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
        width: 100%;
        max-width: 380px;
      }

      .link-btn {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1rem 1.4rem;
        border-radius: 14px;
        text-decoration: none;
        transition:
          transform 0.18s ease,
          opacity 0.18s ease;
        cursor: pointer;
        border: none;
      }

      .link-btn:hover {
        transform: translateY(-2px);
        opacity: 0.93;
      }
      .link-btn:active {
        transform: translateY(0px) scale(0.98);
      }

      .btn-spotify {
        background: #f3a5bb;
      }
      .btn-apple {
        background: #ffb900;
      }
      .btn-deezer {
        background: #add2ef;
        position: relative;
        cursor: not-allowed;
      }
      .btn-deezer .btn-label,
      .btn-deezer .btn-name {
        color: #3a5079;
      }
      .btn-deezer:hover {
        transform: none;
        opacity: 1;
      }
      .btn-deezer .coming-soon {
        position: absolute;
        top: 50%;
        right: 1.4rem;
        transform: translateY(-50%);
        font-family: "Nunito Sans", sans-serif;
        font-size: 0.65rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-weight: 600;
        color: #3a5079;
        background: rgba(255, 255, 255, 0.45);
        padding: 0.3rem 0.6rem;
        border-radius: 100px;
      }

      .btn-icon {
        width: 32px;
        height: 32px;
        flex-shrink: 0;
      }

      .btn-text {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .btn-label {
        font-family: "Nunito Sans", sans-serif;
        font-size: 0.65rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-weight: 300;
        opacity: 0.65;
      }

      .btn-name {
        font-family: "Nunito Sans", sans-serif;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .btn-spotify .btn-label,
      .btn-spotify .btn-name {
        color: #3a5079;
      }
      .btn-apple .btn-label,
      .btn-apple .btn-name {
        color: #3a5079;
      }

      .socials {
        display: flex;
        gap: 1.5rem;
        align-items: center;
        justify-content: center;
        margin-top: 0.5rem;
      }
      .social-icon {
        color: #3a5079;
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition:
          color 0.18s ease,
          transform 0.18s ease;
      }
      .social-icon svg {
        width: 100%;
        height: 100%;
      }
      .social-icon:hover {
        color: #3a5079;
        opacity: 0.7;
        transform: translateY(-2px);
      }
    </style>
  </head>

    <!-- BANNIÈRE PHOTO + LOGO PAR DESSUS -->
    <div class="banner">
      <img class="banner-photo" src="banner.jpg" alt="neen" />

      <img class="banner-logo" src="logo.png" alt="neen" />
