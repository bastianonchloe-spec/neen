<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>neen.fm</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        background-color: #f7f1ee;
      }

      body {
        height: 100svh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: "Nunito Sans", sans-serif;
        position: relative;
        overflow: hidden;
      }

      /* FOND PEINTURE */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background: url("background.jpg") center/cover no-repeat;
      }

      /* LOGO + LIENS */
      .hero {
        position: relative;
        width: 100%;
        height: 100svh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: clamp(1rem, 2.5vh, 2rem);
        overflow: hidden;
      }

      .hero-inner {
        --logo-w: min(350px, 74vw);
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(0.8rem, 2.2vh, 1.4rem);
      }

      .site-logo {
        position: relative;
        width: var(--logo-w);
        height: auto;
        display: block;
        filter: drop-shadow(0 8px 16px rgba(70, 20, 45, 0.18));
      }

      /* LIBELLULES EN VOL */
      .flyers {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        overflow: hidden;
      }

      .flyer {
        position: absolute;
        left: 0;
        top: 0;
        width: var(--w);
        pointer-events: auto;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        will-change: transform;
      }

      .flyer:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.9);
        outline-offset: 4px;
        border-radius: 999px;
      }

      .flyer img {
        display: block;
        width: 100%;
        height: auto;
        transform-origin: 50% 50%;
        filter: drop-shadow(0 10px 16px rgba(40, 30, 50, 0.24));
        will-change: transform;
      }

      .flyer-a {
        --w: clamp(90px, 10vw, 150px);
        transform: translate3d(22vw, 26vh, 0) translate(-50%, -50%);
      }

      .flyer-c {
        --w: clamp(70px, 7vw, 112px);
        transform: translate3d(78vw, 72vh, 0) translate(-50%, -50%);
      }

      /* Coccinelle et scarabées : petits insectes, tailles relatives aux
         libellules. Les deux scarabées ont exactement la taille de la
         coccinelle. */
      .flyer-h,
      .flyer-k,
      .flyer-l,
      .flyer-m,
      .flyer-n {
        --w: clamp(22px, 2.5vw, 36px);
        transform: translate3d(72vw, 62vh, 0) translate(-50%, -50%);
      }

      @media (max-width: 700px) {
        .flyer-a {
          --w: clamp(64px, 15vw, 96px);
        }

        .flyer-c {
          --w: clamp(52px, 12vw, 76px);
        }

        .flyer-h,
        .flyer-k,
        .flyer-l,
        .flyer-m,
        .flyer-n {
          --w: clamp(20px, 5vw, 30px);
        }
      }

      /* STICKERS ÉPARPILLÉS */
      .stickers {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        overflow: hidden;
      }

      .sticker {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        transform: rotate(var(--rot, 0deg));
        transform-origin: 50% 50%;
        filter: drop-shadow(0 4px 7px rgba(40, 30, 45, 0.2));
        will-change: transform;
        user-select: none;
      }

      .sticker img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .sticker-button,
      .sticker-gem,
      .sticker-spin,
      .sticker-bougie {
        pointer-events: auto;
      }

      .sticker-button,
      .sticker-bougie,
      .sticker-theiere,
      .sticker-timbre {
        cursor: pointer;
      }

      /* Théière et timbre restent sobres au clavier : pas de cadre blanc,
         un halo doux à la place. */
      .sticker-theiere,
      .sticker-timbre {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      .sticker-theiere:focus,
      .sticker-theiere:focus-visible,
      .sticker-timbre:focus,
      .sticker-timbre:focus-visible {
        outline: none;
      }

      .sticker-theiere:focus-visible,
      .sticker-timbre:focus-visible {
        filter: brightness(1.05) drop-shadow(0 0 7px rgba(255, 246, 214, 0.85));
      }

      /* Objets ronds (boutons, fleurs, café) : un tour complet sur eux-mêmes. */
      @keyframes sticker-spin {
        from {
          transform: rotate(var(--rot, 0deg));
        }
        to {
          transform: rotate(calc(var(--rot, 0deg) + 360deg));
        }
      }

      .sticker-button:hover,
      .sticker-spin:hover {
        animation: sticker-spin 1.9s cubic-bezier(0.2, 0.7, 0.3, 1);
        z-index: 2;
      }

      /* Bougie : se dandine comme un coquillage au survol, et s'éteint au clic. */
      .sticker-bougie {
        transform-origin: 50% 50%;
      }

      @keyframes candle-rock {
        0%,
        100% {
          transform: rotate(calc(var(--rock, 3deg) * -0.8)) translateY(0);
        }
        35% {
          transform: rotate(calc(var(--rock, 3deg) * 0.6)) translateY(-1.4px);
        }
        70% {
          transform: rotate(calc(var(--rock, 3deg) * -0.3)) translateY(0.7px);
        }
      }

      .sticker-bougie:hover img {
        animation: candle-rock var(--dur, 2.2s) ease-in-out infinite;
        transform-origin: 50% 92%;
      }

      .sticker-bougie {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      .sticker-bougie:focus,
      .sticker-bougie:focus-visible {
        outline: none;
      }

      .sticker-bougie:focus-visible {
        filter: brightness(1.06) drop-shadow(0 0 7px rgba(255, 246, 214, 0.9));
      }

      /* Nuit : voile sombre quand la bougie s'éteint. Noir complet pendant
         deux secondes, puis veilleuse douce tant que la flamme reste éteinte. */
      .night {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: radial-gradient(
          circle at 50% 46%,
          rgba(14, 12, 22, 0.52),
          rgba(5, 5, 11, 0.84) 78%
        );
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.6s ease;
      }

      .night.is-on {
        opacity: 1;
      }

      .night.is-dim {
        opacity: 0.34;
      }

      /* Gemmes : le brillant s'allume tout de suite et reste tant que la
         souris est dessus (aucun délai, aucun clignotement). */
      .sticker-gem {
        transition: filter 0.12s ease;
      }

      .sticker-gem:hover {
        filter: brightness(1.28) saturate(1.18)
          drop-shadow(0 0 7px rgba(255, 248, 220, 0.95))
          drop-shadow(0 0 18px rgba(255, 190, 225, 0.8));
      }

      /* Objets qui se balancent de -15° à +15° au survol. Le balancement
         part du centre vers la gauche, puis revient à droite. */
      @keyframes sticker-swing {
        0%,
        100% {
          transform: rotate(var(--rot, 0deg));
        }
        30% {
          transform: rotate(calc(var(--rot, 0deg) - 15deg));
        }
        70% {
          transform: rotate(calc(var(--rot, 0deg) + 15deg));
        }
      }

      .sticker-swing {
        pointer-events: auto;
      }

      .sticker-swing:hover {
        animation: sticker-swing 1.9s ease-in-out infinite;
        z-index: 2;
      }

      /* Étoiles : zoom avant puis retour à la taille normale au survol. */
      .sticker-star {
        pointer-events: auto;
        cursor: pointer;
      }

      @keyframes star-zoom {
        0% {
          transform: rotate(var(--rot, 0deg)) scale(1);
        }
        45% {
          transform: rotate(var(--rot, 0deg)) scale(1.13);
        }
        100% {
          transform: rotate(var(--rot, 0deg)) scale(1);
        }
      }

      .sticker-star:hover {
        animation: star-zoom 0.95s cubic-bezier(0.34, 1.24, 0.5, 1);
        z-index: 2;
      }

      /* COQUILLAGES */
      .coquillages {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        overflow: hidden;
        user-select: none;
      }

      .coquillage {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        padding: 0;
        border: 0;
        background: none;
        opacity: 0;
        cursor: pointer;
        pointer-events: auto;
        transform: rotate(var(--rest, 0deg));
        transform-origin: 50% 50%;
        transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      .coquillage.is-placed {
        opacity: 1;
      }

      .coquillage:focus {
        outline: none;
      }

      .coquillage:focus-visible {
        outline: none;
        filter: brightness(1.06) drop-shadow(0 0 7px rgba(255, 255, 255, 0.6));
      }

      .coquillage img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        transform-origin: 50% 92%;
        animation: coquillage-rock var(--dur, 7s) ease-in-out infinite;
        animation-delay: var(--delay, 0s);
        filter: drop-shadow(0 3px 4px rgba(28, 38, 28, 0.3));
        will-change: transform;
      }

      .coquillage:hover {
        transform: rotate(var(--rest, 0deg)) scale(1.08);
      }

      .coquillage:hover img {
        filter: drop-shadow(0 6px 8px rgba(28, 38, 28, 0.34));
      }

      /* Léger dandinement, comme un bigorneau qui bouge dans sa coquille. */
      @keyframes coquillage-rock {
        0%,
        100% {
          transform: rotate(calc(var(--rock, 3deg) * -1)) translateY(0);
        }
        32% {
          transform: rotate(calc(var(--rock, 3deg) * 0.7)) translateY(-1.6px);
        }
        68% {
          transform: rotate(calc(var(--rock, 3deg) * -0.35)) translateY(0.9px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .coquillage img,
        .sticker-button:hover,
        .sticker-gem:hover,
        .sticker-star:hover,
        .sticker-spin:hover,
        .sticker-swing:hover,
        .sticker-bougie:hover img {
          animation: none;
        }

        .night {
          transition: none;
        }
      }

      /* ÉTIQUETTES PAPIER */
      .labels {
        width: min(346px, 50.4vw);
        display: flex;
        flex-direction: column;
        row-gap: clamp(0.6rem, 1.6vh, 1rem);
      }

      .label-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: clamp(0.4rem, 1vw, 0.8rem);
        align-items: center;
      }

      .label-link {
        display: block;
        width: 100%;
        max-width: 167px;
        transform: rotate(var(--rot, 0deg)) scale(var(--scale, 1));
        transform-origin: 50% 50%;
        filter: drop-shadow(0 7px 11px rgba(45, 35, 45, 0.3));
        transition:
          transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
          filter 0.28s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .label-link img {
        display: block;
        width: 100%;
        height: auto;
        pointer-events: none;
      }

      .label-link:hover {
        transform: rotate(0deg) scale(calc(var(--scale, 1) * 1.045));
        filter: drop-shadow(0 14px 20px rgba(45, 35, 45, 0.38));
      }

      .label-link:active {
        transform: rotate(0deg) scale(calc(var(--scale, 1) * 0.985));
      }

      .label-instagram {
        --rot: -3deg;
        justify-self: start;
        grid-column: 1;
        grid-row: 1;
      }

      .label-spotify {
        --rot: 2.5deg;
        justify-self: end;
        grid-column: 2;
        grid-row: 1;
        margin-top: 0.6rem;
      }

      .label-youtube {
        --rot: 1.8deg;
        justify-self: center;
        grid-column: 1;
        grid-row: 2;
        margin-left: 4%;
      }

      .label-apple-music {
        --rot: -2deg;
        --scale: 1.3;
        justify-self: start;
        grid-column: 1;
        grid-row: 3;
      }

      .label-deezer {
        --rot: 2.8deg;
        justify-self: end;
        grid-column: 2;
        grid-row: 3;
        margin-top: 0.5rem;
      }

      .label-mail {
        --rot: -1.5deg;
        justify-self: end;
        grid-column: 2;
        grid-row: 2;
        margin-top: 0.6rem;
      }

      .socials {
        display: flex;
        gap: 1.5rem;
        align-items: center;
        justify-content: center;
      }
      .social-icon {
        color: #ad1457;
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        filter: drop-shadow(0 2px 4px rgba(255, 255, 255, 0.45));
        transition:
          color 0.18s ease,
          transform 0.18s ease;
      }
      .social-icon svg {
        width: 100%;
        height: 100%;
      }
      .social-icon.email-icon {
        width: 32px;
        height: 32px;
      }
      .social-icon:hover {
        color: #8e0f46;
        opacity: 0.8;
        transform: translateY(-2px);
      }

      /* Téléphone : chaque rangée d'étiquettes s'étire d'une ligne latérale du
         logo à l'autre. Les deux étiquettes d'une même rangée se partagent la
         largeur au prorata de la taille de leur écriture (--share), pour que
         la typographie manuscrite ait la même hauteur de part et d'autre. */
      @media (max-width: 700px) {
        .labels {
          width: var(--logo-w);
          /* Les papiers restent à l'aplomb des lignes du logo sans que leur
             bord déchiré soit pile dessus (ce qui donnait l'impression d'un
             rognage net) : 9 px de respiration de chaque côté. */
          padding-inline: 9px;
          row-gap: 0.9rem;
        }

        .label-row {
          display: flex;
          column-gap: 0.35rem;
          align-items: center;
        }

        .label-link {
          min-width: 0;
          max-width: none;
          --scale: 1;
          flex: var(--share, 1) 1 0;
        }

        .label-instagram {
          --share: 2.38;
        }

        .label-spotify {
          --share: 2.62;
          margin-top: 0.5rem;
        }

        .label-youtube {
          --share: 2.34;
          margin-left: 0;
        }

        .label-mail {
          --share: 2.27;
        }

        /* Deezer et Apple Music côte à côte, mais Deezer à gauche et Apple
           Music à droite. Apple Music est un peu rétrécie pour laisser à
           Deezer une taille correcte ; les deux restent collées aux lignes
           latérales du logo. */
        .label-deezer {
          --share: 2.2;
          order: 1;
          margin-top: 0.4rem;
        }

        .label-apple-music {
          --share: 2.7;
          order: 2;
        }
      }

      @media (max-width: 480px) {
        .hero {
          padding: 1.25rem;
        }

        .hero-inner {
          --logo-w: min(300px, 82vw);
        }
      }
    </style>

    <script>
      (() => {
        const flyers = [...document.querySelectorAll(".flyer")];
        if (!flyers.length) return;

        const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const TAU = Math.PI * 2;

        // "fly"   : libellule, grands 8 dans l'air, battements d'ailes rapides.
        // "crawl" : coccinelle et scarabées, marche lente et sinueuse, corps
        //           toujours orienté dans l'axe du déplacement.
        // base = orientation de la tête dans l'image, en degrés.
        const specs = [
          { sel: ".flyer-a", kind: "fly", base: -90, ax: 0.44, ay: 0.42, fx: 1, fy: 2, px: 0.0, py: 1.4, rf: 6, rp: 0.4, period: 58 },
          { sel: ".flyer-c", kind: "fly", base: -90, ax: 0.30, ay: 0.45, fx: 2, fy: 1, px: 3.6, py: 2.2, rf: 5, rp: 3.4, period: 74 },
          { sel: ".flyer-h", kind: "crawl", base: -90, ax: 0.34, ay: 0.36, fx: 1, fy: 2, px: 0.6, py: 4.2, rf: 2, rp: 1.1, period: 96, gait: 7.0, gaitAmp: 2.2 },
          { sel: ".flyer-k", kind: "crawl", base: -90, ax: 0.38, ay: 0.40, fx: 2, fy: 1, px: 2.9, py: 0.7, rf: 3, rp: 2.4, period: 108, gait: 6.0, gaitAmp: 2.6 },
          { sel: ".flyer-l", kind: "crawl", base: -90, ax: 0.33, ay: 0.38, fx: 1, fy: 3, px: 3.7, py: 2.6, rf: 2, rp: 4.1, period: 118, gait: 6.4, gaitAmp: 2.4 },
          { sel: ".flyer-m", kind: "crawl", base: -90, ax: 0.30, ay: 0.33, fx: 2, fy: 2, px: 1.7, py: 5.1, rf: 4, rp: 0.8, period: 84, gait: 7.4, gaitAmp: 2.3 },
          { sel: ".flyer-n", kind: "crawl", base: -90, ax: 0.35, ay: 0.34, fx: 2, fy: 3, px: 5.2, py: 1.9, rf: 3, rp: 3.9, period: 97, gait: 6.2, gaitAmp: 2.5 },
        ]
          .map((s) => {
            const el = document.querySelector(s.sel);
            return el
              ? { ...s, el, img: el.querySelector("img"), rot: null }
              : null;
          })
          .filter((s) => s && s.img);

        const start = performance.now();

        // --- Clic sur un insecte -------------------------------------------
        // L'insecte continue son vol : on entend seulement son bruit
        // (les 3 premières secondes de l'audio), uniquement au clic.
        const audio = document.getElementById("insect-audio");
        const SOUND_MS = 3000;
        let audioTimer = null;

        const playInsectSound = () => {
          if (!audio) return;
          if (audioTimer !== null) {
            clearTimeout(audioTimer);
            audioTimer = null;
          }
          audio.pause();
          audio.currentTime = 0;
          const played = audio.play();
          if (played && typeof played.catch === "function") played.catch(() => {});
          audioTimer = window.setTimeout(() => {
            audio.pause();
            audio.currentTime = 0;
            audioTimer = null;
          }, SOUND_MS);
        };

        for (const s of specs) {
          s.el.addEventListener("click", playInsectSound);
          s.el.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              playInsectSound();
            }
          });
        }

        if (prefersReduced) return;

        const frame = (now) => {
          const t = (now - start) / 1000;
          const W = window.innerWidth;
          const H = window.innerHeight;

          for (const s of specs) {
            const ph = (t / s.period) * TAU;
            const r = Math.min(W, H) * (s.kind === "fly" ? 0.046 : 0.026);

            const x =
              W * (0.5 + s.ax * Math.sin(s.fx * ph + s.px)) +
              r * Math.cos(s.rf * ph + s.rp);
            const y =
              H * (0.5 + s.ay * Math.sin(s.fy * ph + s.py)) +
              r * Math.sin(s.rf * ph + s.rp);

            const dx =
              W * s.ax * s.fx * Math.cos(s.fx * ph + s.px) -
              r * s.rf * Math.sin(s.rf * ph + s.rp);
            const dy =
              H * s.ay * s.fy * Math.cos(s.fy * ph + s.py) +
              r * s.rf * Math.cos(s.rf * ph + s.rp);

            const heading = Math.atan2(dy, dx) * 180 / Math.PI;

            // Lissage de l'orientation : l'insecte pivote au lieu de se
            // retourner d'un coup dans les virages serrés.
            const target = heading - s.base;
            if (s.rot === null) {
              s.rot = target;
            } else {
              const delta = ((target - s.rot + 540) % 360) - 180;
              s.rot += delta * (s.kind === "fly" ? 0.16 : 0.1);
            }

            let bob = 0;
            let extra = 0;
            let scale = 1;
            let sx = 1;

            if (s.kind === "fly") {
              // Battements d'ailes : oscillation rapide et légère.
              const flap = Math.sin(t * 22 + s.px * 3);
              sx = 1 + flap * 0.07;
              bob = flap * 1.6;
              extra = Math.sin(t * 1.9 + s.px) * 3 + flap * 1.2;
              scale = 1 + Math.sin(t * 0.8 + s.px) * 0.03;
            } else {
              // Petits pas : le corps oscillle et rebondit à peine.
              const gait = Math.sin(t * s.gait + s.px * 3);
              extra = gait * s.gaitAmp;
              bob = Math.abs(gait) * 0.8;
            }

            s.el.style.transform = `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, 0) translate(-50%, -50%)`;
            s.img.style.transform = `translateY(${bob.toFixed(2)}px) rotate(${(s.rot + extra).toFixed(2)}deg) scale(${scale.toFixed(3)}) scaleX(${sx.toFixed(3)})`;
          }

          requestAnimationFrame(frame);
        };

        requestAnimationFrame(frame);
      })();
    </script>

    <script>
      // Semis organique : stickers et coquillages sont répartis ensemble autour
      // du bloc logo + liens, sans jamais se chevaucher, à toutes les tailles.
      (() => {
        const items = [
          ...[...document.querySelectorAll(".stickers .sticker")].map((el) => ({
            el,
            kind: "sticker",
          })),
          ...[...document.querySelectorAll(".coquillages .coquillage")].map((el) => ({
            el,
            kind: "shell",
          })),
        ];
        if (!items.length) return;

        const hero = document.querySelector(".hero-inner");

        // Tirage déterministe : le semis reste le même d'une visite à l'autre.
        const SEED = 20260514;
        let seed = SEED;
        const rand = () => {
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        const between = (a, b) => a + rand() * (b - a);

        const boxes = [];

        const cornersOf = (b) => {
          const c = Math.cos(b.a);
          const s = Math.sin(b.a);
          return [
            [-b.hw, -b.hh],
            [b.hw, -b.hh],
            [b.hw, b.hh],
            [-b.hw, b.hh],
          ].map(([x, y]) => [b.cx + x * c - y * s, b.cy + x * s + y * c]);
        };

        const aabb = (b) => {
          const pts = cornersOf(b);
          let l = Infinity, t = Infinity, r = -Infinity, bo = -Infinity;
          for (const [x, y] of pts) {
            if (x < l) l = x;
            if (x > r) r = x;
            if (y < t) t = y;
            if (y > bo) bo = y;
          }
          return { l, t, r, b: bo };
        };

        const hits = (A, B) => {
          const ca = cornersOf(A);
          const cb = cornersOf(B);
          const axes = [];
          for (const pts of [ca, cb]) {
            for (let i = 0; i < 4; i++) {
              const [x1, y1] = pts[i];
              const [x2, y2] = pts[(i + 1) % 4];
              const dx = x2 - x1;
              const dy = y2 - y1;
              const len = Math.hypot(dx, dy) || 1;
              axes.push([-dy / len, dx / len]);
            }
          }
          for (const [ax, ay] of axes) {
            let minA = Infinity, maxA = -Infinity, minB = Infinity, maxB = -Infinity;
            for (const [x, y] of ca) {
              const p = x * ax + y * ay;
              if (p < minA) minA = p;
              if (p > maxA) maxA = p;
            }
            for (const [x, y] of cb) {
              const p = x * ax + y * ay;
              if (p < minB) minB = p;
              if (p > maxB) maxB = p;
            }
            if (maxA < minB || maxB < minA) return false;
          }
          return true;
        };

        const clearance = (A, B) => {
          const a = aabb(A);
          const b = aabb(B);
          const dx = Math.max(a.l - b.r, b.l - a.r, 0);
          const dy = Math.max(a.t - b.b, b.t - a.b, 0);
          return Math.hypot(dx, dy);
        };

        let signature = "";

        const layout = (force) => {
          const W = window.innerWidth;
          const H = window.innerHeight;
          const mobile = W < 700;

          const obstacles = [];
          const labels = [...document.querySelectorAll(".label-link")];
          const logo = document.querySelector(".site-logo");

          const boxOf = (el, pad) => {
            if (!el) return null;
            const r = el.getBoundingClientRect();
            if (r.width < 2 || r.height < 2) return null;
            return {
              cx: (r.left + r.right) / 2,
              cy: (r.top + r.bottom) / 2,
              hw: r.width / 2 + pad,
              hh: r.height / 2 + pad,
              a: 0,
            };
          };

          if (mobile) {
            // Sur téléphone, on protège le logo et toute la bande des papiers,
            // bords compris : aucun objet ne vient se coller à gauche ou à
            // droite des boutons.
            const o = boxOf(logo, 4);
            if (o) obstacles.push(o);
            const rects = labels
              .map((el) => el.getBoundingClientRect())
              .filter((r) => r.width > 2 && r.height > 2);
            if (rects.length) {
              const top = Math.min(...rects.map((r) => r.top));
              const bottom = Math.max(...rects.map((r) => r.bottom));
              obstacles.push({
                cx: W / 2,
                cy: (top + bottom) / 2,
                hw: W / 2,
                hh: (bottom - top) / 2 + 6,
                a: 0,
              });
            }
          } else {
            const o = boxOf(hero, 22);
            if (o) obstacles.push(o);
          }

          const edge = mobile ? 4 : 12;
          const gap = mobile ? 6 : 14;

          const sig = [
            Math.round(W),
            Math.round(H),
            ...obstacles.map((o) => [o.cx, o.cy, o.hw, o.hh].map(Math.round).join(",")),
          ].join("|");
          if (!force && sig === signature) return;
          signature = sig;

          boxes.length = 0;
          boxes.push(...obstacles);

          // Positions retenues, pour un dernier réglage à la main sur mobile.
          const placedItems = [];
          // Taille de référence : relative à l'écran, plafonnée pour que les
          // objets restent des petits riens posés sur la peinture.
          const base = Math.max(
            mobile ? 34 : 30,
            Math.min(W * (mobile ? 0.096 : 0.082), H * 0.096, mobile ? 92 : 86),
          );
          // Les objets prennent la taille qu'ils ont sur la maquette : un
          // peu plus présents sur la peinture, sans devenir envahissants.
          const BOOST = 1.45;
          // Sur téléphone, tout le monde s'aligne sur la taille du champignon.
          const champignon = base * 0.9 * BOOST * 0.95;

          // Même point de départ à chaque passage : le semis ne bouge plus
          // quand la page se recharge ou que la fenêtre se redimensionne.
          seed = SEED;

          const order = items.slice();
          for (let i = order.length - 1; i > 0; i--) {
            const j = Math.floor(rand() * (i + 1));
            [order[i], order[j]] = [order[j], order[i]];
          }

          order.forEach(({ el, kind }) => {
            const media = el.tagName === "IMG" ? el : el.querySelector("img");
            const iw =
              Number(el.getAttribute("width")) ||
              Number(media && media.getAttribute("width")) ||
              1;
            const ih =
              Number(el.getAttribute("height")) ||
              Number(media && media.getAttribute("height")) ||
              1;
            const ratio = iw / ih;
            const wide = ratio >= 1;
            const bias = Number(el.dataset.size) || 1;
            const upright = el.dataset.upright === "1";
            const scale = between(0.74, 1.16) * bias;
            let size = mobile
              ? champignon * between(0.93, 1.07)
              : Math.max(26, base * scale * BOOST);
            let w = wide ? size : size * ratio;
            let h = wide ? size / ratio : size;

            let spot = null;

            for (let round = 0; round < 4 && !spot; round++) {
              if (round) {
                w *= 0.86;
                h *= 0.86;
              }
              const candidates = [];
              for (let tryI = 0; tryI < 900 && candidates.length < 40; tryI++) {
                const rot = upright
                  ? 0
                  : kind === "shell"
                    ? between(-26, 26)
                    : rand() < 0.2
                      ? between(-38, -22)
                      : rand() < 0.2
                        ? between(22, 38)
                        : between(-19, 19);
                const rad = (rot * Math.PI) / 180;
                const ex = (Math.abs(w * Math.cos(rad)) + Math.abs(h * Math.sin(rad))) / 2;
                const ey = (Math.abs(w * Math.sin(rad)) + Math.abs(h * Math.cos(rad))) / 2;
                if (ex * 2 > W - edge * 2 || ey * 2 > H - edge * 2) continue;

                const cx = between(edge + ex, W - edge - ex);
                const cy = between(edge + ey, H - edge - ey);
                const cand = { cx, cy, hw: w / 2 + gap / 2, hh: h / 2 + gap / 2, a: rad, rot };

                if (boxes.some((b) => hits(cand, b))) continue;
                cand.score = Math.min(...boxes.map((b) => clearance(cand, b))) + rand() * 16;
                candidates.push(cand);
              }
              if (candidates.length) {
                candidates.sort((a, b) => b.score - a.score);
                if (mobile) {
                  // Sur téléphone, on tire une place au hasard parmi celles
                  // qui conviennent : c'est ce qui casse les alignements.
                  spot = candidates[Math.floor(rand() * candidates.length)];
                } else {
                  spot = candidates[0];
                }
              }
            }

            if (!spot) {
              el.classList.remove("is-placed");
              return;
            }

            el.style.width = `${w}px`;
            el.style.height = `${h}px`;
            el.style.left = `${spot.cx - w / 2}px`;
            el.style.top = `${spot.cy - h / 2}px`;

            if (kind === "shell") {
              el.style.setProperty("--rest", `${spot.rot.toFixed(2)}deg`);
              el.style.setProperty("--rock", `${between(2, 4).toFixed(2)}deg`);
              el.style.setProperty("--dur", `${between(6.2, 8.8).toFixed(2)}s`);
              el.style.setProperty("--delay", `${(-between(0, 5)).toFixed(2)}s`);
            } else {
              el.style.setProperty("--rot", `${spot.rot.toFixed(2)}deg`);
            }
            el.classList.add("is-placed");

            boxes.push({ cx: spot.cx, cy: spot.cy, hw: w / 2, hh: h / 2, a: (spot.rot * Math.PI) / 180 });
            const radPlaced = (spot.rot * Math.PI) / 180;
            placedItems.push({
              el,
              cx: spot.cx,
              cy: spot.cy,
              hw: w / 2,
              hh: h / 2,
              // Encombrement réel une fois l'objet incliné : sert à le
              // garder entièrement dans l'écran.
              rx: (Math.abs(w * Math.cos(radPlaced)) + Math.abs(h * Math.sin(radPlaced))) / 2,
              ry: (Math.abs(w * Math.sin(radPlaced)) + Math.abs(h * Math.cos(radPlaced))) / 2,
              a: radPlaced,
            });
          });

          // Sur téléphone, un dernier coup de pouce : chaque objet glisse un
          // peu sur la peinture. Cela casse les petites lignes qui se
          // forment en bas de l'écran quand la place se raréfie.
          if (mobile && placedItems.length) {
            const withGap = (p) => ({
              cx: p.cx,
              cy: p.cy,
              hw: p.hw + gap / 2,
              hh: p.hh + gap / 2,
              a: p.a,
            });
            for (let iter = 0; iter < 4; iter++) {
              for (const p of placedItems) {
                const nx = Math.min(
                  Math.max(p.cx + between(-8, 8), edge + p.rx),
                  W - edge - p.rx,
                );
                const ny = Math.min(
                  Math.max(p.cy + between(-14, 14), edge + p.ry),
                  H - edge - p.ry,
                );
                const cand = { cx: nx, cy: ny, hw: p.hw + gap / 2, hh: p.hh + gap / 2, a: p.a };
                if (obstacles.some((b) => hits(cand, b))) continue;
                if (placedItems.some((q) => q !== p && hits(cand, withGap(q)))) continue;
                p.cx = nx;
                p.cy = ny;
              }
            }
            for (const p of placedItems) {
              p.el.style.left = `${(p.cx - p.hw).toFixed(2)}px`;
              p.el.style.top = `${(p.cy - p.hh).toFixed(2)}px`;
            }
          }
        };

        let timer = 0;
        const schedule = () => {
          window.clearTimeout(timer);
          timer = window.setTimeout(layout, 120);
        };

        layout(true);
        window.addEventListener("resize", schedule);
        window.addEventListener("load", () => layout(true));
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(() => layout(true));
        }
        if ("ResizeObserver" in window && hero) {
          const ro = new ResizeObserver(schedule);
          ro.observe(hero);
        }
        window.addEventListener("orientationchange", () => layout(true));
      })();
    </script>

    <script>
      // Étoiles : petit scintillement sonore au clic.
      (() => {
        const audio = document.getElementById("star-audio");
        const stars = [...document.querySelectorAll(".sticker-star")];
        if (!audio || !stars.length) return;

        for (const star of stars) {
          star.addEventListener("click", () => {

            const played = audio.play();
            if (played && typeof played.catch === "function") played.catch(() => {});
          });

    </script>

    <script>
      // Coquillages : clic = environ 2 secondes de vagues, avec un fondu
      // de sortie sur la fin pour que le bruit s'éteigne en douceur.
      (() => {
        const audio = document.getElementById("shell-audio");
        const shells = [...document.querySelectorAll(".coquillages .coquillage")];
        if (!audio || !shells.length) return;

        const CLIP_MS = 2000;
        const FADE_MS = 800;
        const BASE_VOLUME = 1;
        let startTimer = null;
        let fadeTimer = null;
        let safetyTimer = null;

        const stop = () => {
          if (startTimer !== null) {
            clearTimeout(startTimer);
            startTimer = null;
          }
          if (fadeTimer !== null) {
            clearInterval(fadeTimer);
            fadeTimer = null;
          }
          if (safetyTimer !== null) {
            clearTimeout(safetyTimer);
            safetyTimer = null;
          }
          audio.pause();
          audio.currentTime = 0;
          audio.volume = BASE_VOLUME;
        };

        const fadeOut = () => {
          if (fadeTimer !== null) {
            clearInterval(fadeTimer);
            fadeTimer = null;
          }
          const startLevel = audio.volume;
          const t0 = performance.now();
          // Intervalle plutôt que requestAnimationFrame : le fondu reste
          // régulier même si l'onglet n'est pas au premier plan.
          fadeTimer = window.setInterval(() => {
            const k = Math.min(1, (performance.now() - t0) / FADE_MS);
            // Courbe adoucie : la vague s'éteint sans coupure sèche.
            audio.volume = startLevel * Math.pow(1 - k, 1.6);
            if (k >= 1) stop();
          }, 40);
          // Filet de sécurité : on coupe même si les timers sont ralentis.
          safetyTimer = window.setTimeout(stop, FADE_MS + 300);
        };

        const play = () => {
          stop();
          audio.volume = BASE_VOLUME;
          const played = audio.play();
          if (played && typeof played.catch === "function") played.catch(() => {});
          startTimer = window.setTimeout(fadeOut, CLIP_MS - FADE_MS);
        };

        for (const shell of shells) {
          shell.addEventListener("click", play);
          shell.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              play();
            }
          });
        }
      })();
    </script>

    <script>
      // Petits sons de clic : le thé qui coule, le timbre qu'on tamponne.
      // Chaque extrait démarre au moment utile du fichier d'origine, sans
      // le silence qui précède.
      (() => {
        const sounds = [
          { audio: "theiere-audio", el: ".sticker-theiere" },
          { audio: "timbre-audio", el: ".sticker-timbre" },
        ];

        for (const { audio: audioId, el: selector } of sounds) {
          const audio = document.getElementById(audioId);
          const el = document.querySelector(selector);
          if (!audio || !el) continue;

          const play = () => {
            audio.pause();
            audio.currentTime = 0;
            const played = audio.play();
            if (played && typeof played.catch === "function") played.catch(() => {});
          };

          el.addEventListener("click", play);
          el.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              play();
            }
          });
        }
      })();
    </script>

    <script>
      // Bougie : un clic éteint la flamme et assombrit la pièce ; elle reste
      // éteinte jusqu'au clic suivant, qui la rallume.
      (() => {
        const candle = document.querySelector(".sticker-bougie");
        const night = document.querySelector(".night");
        if (!candle || !night) return;

        const DARK_MS = 2000;
        const flame = candle.querySelector("img");
        const LIT = flame.dataset.lit;
        const OUT = flame.dataset.out;
        let off = false;
        let settleTimer = null;

        const relight = () => {
          off = false;
          window.clearTimeout(settleTimer);
          settleTimer = null;
          flame.src = LIT;
          candle.classList.remove("is-out");
          night.classList.remove("is-dim");
          night.classList.remove("is-on");
        };

        const putOut = () => {
          off = true;
          flame.src = OUT;
          candle.classList.add("is-out");
          night.classList.remove("is-dim");
          night.classList.add("is-on");
          window.clearTimeout(settleTimer);
          // Le noir complet laisse place à une veilleuse : la flamme reste
          // éteinte, mais la page redevient lisible.
          settleTimer = window.setTimeout(() => {
            if (!off) return;
            night.classList.remove("is-on");
            night.classList.add("is-dim");
          }, DARK_MS);
        };

        const toggle = () => (off ? relight() : putOut());

        candle.addEventListener("click", toggle);
        candle.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggle();
          }
        });
      })();
    </script>

  </body>
</html>
