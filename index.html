<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>neen — The Quiet Laws of Us</title>
<link href="https://fonts.googleapis.com/css2?family=Batuphat+Script&family=Nunito:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #3A5079;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Nunito', sans-serif;
    position: relative;
    overflow-x: hidden;
  }

  /* BANNIÈRE */
  .banner {
    position: relative;
    width: 100%;
    max-width: 600px;
    height: 420px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .banner-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 15%;
    display: block;
  }

  .banner-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(58,80,121,0.1) 0%,
      rgba(58,80,121,0.15) 50%,
      rgba(58,80,121,0.75) 100%
    );
  }

  .banner-logo {
    position: absolute;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    filter: brightness(0) invert(1);
  }

  /* BLOBS */
  .bg-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.25;
    pointer-events: none;
    z-index: 0;
  }
  .blob1 { width: 350px; height: 350px; background: #C5335C; bottom: -80px; left: -80px; }
  .blob2 { width: 300px; height: 300px; background: #FFB900; bottom: -60px; right: -60px; }

  /* CONTENU */
  .card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.75rem;
    padding: 2rem 2rem 3rem;
  }

  .bio {
    font-family: 'Batuphat Script', cursive;
    font-size: 1.05rem;
    font-weight: 600;
    color: rgba(255,255,255,0.75);
    text-align: center;
    line-height: 1.6;
    max-width: 340px;
  }

  .ep-label {
    display: inline-block;
    border: 1px solid rgba(255,255,255,0.3);
    color: rgba(255,255,255,0.75);
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 0.35rem 1rem;
    border-radius: 100px;
    font-family: 'Nunito', sans-serif;
    font-weight: 300;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
    width: 100%;
    max-width: 380px;
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.4rem;
    border-radius: 14px;
    text-decoration: none;
    transition: transform 0.18s ease, opacity 0.18s ease;
    cursor: pointer;
    border: none;
  }

  .link-btn:hover { transform: translateY(-2px); opacity: 0.93; }
  .link-btn:active { transform: translateY(0px) scale(0.98); }

  .btn-spotify { background: #F3A5BB; }
  .btn-apple   { background: #FFB900; }
  .btn-instagram { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); }

  .btn-icon { width: 32px; height: 32px; flex-shrink: 0; }

  .btn-text { display: flex; flex-direction: column; gap: 1px; }

  .btn-label {
    font-family: 'Nunito', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 300;
    opacity: 0.65;
  }

  .btn-name {
    font-family: 'Batuphat Script', cursive;
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .btn-spotify .btn-label,
  .btn-spotify .btn-name { color: #3A5079; }
  .btn-apple .btn-label,
  .btn-apple .btn-name { color: #3A5079; }
  .btn-instagram .btn-label,
  .btn-instagram .btn-name { color: rgba(255,255,255,0.85); }

  .footer {
    font-family: 'Nunito', sans-serif;
    font-weight: 300;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.25);
    letter-spacing: 0.08em;
    text-align: center;
  }
</style>
</head>
