<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>neen — The Quiet Laws of Us</title>
<link href="https://fonts.googleapis.com/css2?family=Batuphat+Script&family=Nunito:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #3A5079;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Nunito', sans-serif;
    padding: 2rem 1rem;
    position: relative;
    overflow: hidden;
  }

  .bg-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.35;
    pointer-events: none;
  }
  .blob1 { width: 400px; height: 400px; background: #C5335C; top: -100px; left: -100px; }
  .blob2 { width: 350px; height: 350px; background: #FFB900; bottom: -80px; right: -60px; }
  .blob3 { width: 280px; height: 280px; background: #ADD2EF; top: 40%; left: 60%; }

  .card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.5rem;
    padding: 3rem 2rem;
  }

  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }

  .logo-img {
    width: 120px;
    filter: brightness(0) invert(1);
  }

  .tagline {
    font-family: 'Batuphat Script', cursive;
    font-size: 1.35rem;
    color: rgba(255,255,255,0.8);
    letter-spacing: 0.01em;
    text-align: center;
  }

  .ep-label {
    display: inline-block;
    border: 1px solid rgba(255,255,255,0.3);
    color: rgba(255,255,255,0.75);
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 0.35rem 1rem;
    border-radius: 100px;
    font-family: 'Nunito', sans-serif;
    font-weight: 300;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
    width: 100%;
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.4rem;
    border-radius: 14px;
    text-decoration: none;
    transition: transform 0.18s ease, opacity 0.18s ease;
    cursor: pointer;
    border: none;
  }

  .link-btn:hover { transform: translateY(-2px); opacity: 0.93; }
  .link-btn:active { transform: translateY(0px) scale(0.98); }

  .btn-spotify { background: #F3A5BB; }
  .btn-apple   { background: #FFB900; }

  .btn-icon { width: 32px; height: 32px; flex-shrink: 0; }

  .btn-text { display: flex; flex-direction: column; gap: 1px; }

  .btn-label {
    font-family: 'Nunito', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 300;
    opacity: 0.65;
  }

  .btn-name {
    font-family: 'Batuphat Script', cursive;
    font-size: 1.25rem;
    letter-spacing: 0.01em;
  }

  .btn-spotify .btn-label,
  .btn-spotify .btn-name { color: #3A5079; }

  .btn-apple .btn-label,
  .btn-apple .btn-name { color: #3A5079; }

  .footer {
    font-family: 'Nunito', sans-serif;
    font-weight: 300;
    font-size: 0.78rem;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.08em;
    text-align: center;
  }
</style>
</head>
<body>

<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>
<div class="bg-blob blob3"></div>

<div class="card">

  <div class="logo-wrap">
    <img class="logo-img" src="Logo_neen_blanc.png" alt="neen">
    <div class="tagline">The Quiet Laws of Us</div>
    <span class="ep-label">EP · 2025</span>
  </div>

  <div class="links">

    <a class="link-btn btn-spotify" href="https://open.spotify.com/artist/1ocUpH21N3k8H60xNWJ0OX?si=JLG39TniQGWUm19swnYseQ" target="_blank">
      <svg class="btn-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="12" fill="#3A5079"/>
        <path d="M17.4 10.8c-2.9-1.7-7.6-1.9-10.4-1-.4.1-.9-.1-1-.5-.1-.4.1-.9.5-1C9.6 7.1 14.8 7.4 18 9.3c.4.2.5.7.3 1.1-.2.3-.7.5-1.1.3-.3.1-.3 0-.8.1z" fill="#F3A5BB"/>
        <path d="M17.2 13.4c-.3.4-.8.6-1.2.3-2.4-1.5-6-1.9-8.9-1-.4.1-.9-.1-1-.5-.1-.4.1-.9.5-1 3.3-1 7.3-.5 10.1 1.1.4.2.5.7.5 1.1z" fill="#F3A5BB"/>
        <path d="M15.9 15.9c-.2.3-.6.5-1 .3-2.1-1.3-4.8-1.5-7.9-.9-.3.1-.7-.1-.8-.5-.1-.3.1-.7.5-.8 3.4-.7 6.4-.4 8.8 1 .4.3.5.6.4.9z" fill="#F3A5BB"/>
      </svg>
      <div class="btn-text">
        <span class="btn-label">Écouter sur</span>
        <span class="btn-name">Spotify</span>
      </div>
    </a>

    <a class="link-btn btn-apple" href="https://music.apple.com/fr/artist/neen/1894908742?l=en-GB" target="_blank">
      <svg class="btn-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="12" fill="#3A5079"/>
        <path d="M15.6 6.5c.2 1.3-.4 2.5-1.1 3.3-.7.8-1.8 1.4-2.9 1.3-.2-1.2.4-2.4 1.1-3.2.8-.9 2-1.5 2.9-1.4zm3.1 10.1c-.5.7-1 1.4-1.8 1.4-.7 0-1-.5-1.9-.5-.9 0-1.2.5-1.9.5-.7 0-1.2-.6-1.8-1.4-1.6-2.3-1.7-5 0-6.5.8-.7 1.8-1.1 2.7-1.1.8 0 1.5.5 2.1.5.6 0 1.5-.5 2.3-.5.6 0 1.6.3 2.2 1.1-1.9 1.1-1.6 3.9.1 5.5z" fill="#FFB900"/>
      </svg>
      <div class="btn-text">
        <span class="btn-label">Écouter sur</span>
        <span class="btn-name">Apple Music</span>
      </div>
    </a>

  </div>

  <div class="footer">blue adrenaline · honey burn · mother pearl</div>

</div>

</body>
</html>
