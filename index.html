<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>neen.fm</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        background-color: #f7f1ee;
      }

      body {
        height: 100svh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: "Nunito Sans", sans-serif;
        position: relative;
        overflow: hidden;
      }

      /* FOND PEINTURE */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background: url("background.jpg") center/cover no-repeat;
      }

      /* LOGO + LIENS */
      .hero {
        position: relative;
        width: 100%;
        height: 100svh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: clamp(1rem, 2.5vh, 2rem);
        overflow: hidden;
      }

      .hero-inner {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(0.8rem, 2.2vh, 1.4rem);
      }

      .site-logo {
        position: relative;
        width: min(350px, 74vw);
        height: auto;
        display: block;
        filter: drop-shadow(0 8px 16px rgba(70, 20, 45, 0.18));
      }

      /* STICKERS */
      .sticker {
        position: absolute;
        z-index: 1;
        width: var(--w);
        transform: translate(-50%, -50%);
        pointer-events: none;
        user-select: none;
      }

      .sticker img {
        display: block;
        width: 100%;
        height: auto;
        transform-origin: 50% 50%;
        animation: sticker-sway var(--dur, 8s) ease-in-out infinite;
        animation-delay: var(--delay, 0s);
        filter: drop-shadow(0 7px 12px rgba(58, 80, 121, 0.2));
        will-change: transform;
      }

      @keyframes sticker-sway {
        0%,
        100% {
          transform: rotate(-30deg);
        }
        50% {
          transform: rotate(30deg);
        }
      }

      .sticker-heart-magenta {
        left: 13%;
        top: 16%;
        --w: clamp(56px, 5vw, 76px);
        --dur: 7.2s;
        --delay: -1.1s;
      }

      .sticker-star-pink {
        left: 30%;
        top: 8%;
        --w: clamp(62px, 6vw, 92px);
        --dur: 8.6s;
        --delay: -3.2s;
      }

      .sticker-dragonfly-pale {
        left: 83%;
        top: 14%;
        --w: clamp(80px, 10vw, 145px);
        --dur: 9.4s;
        --delay: -2.4s;
      }

      .sticker-butterfly-green {
        left: 5%;
        top: 42%;
        --w: clamp(92px, 11vw, 165px);
        --dur: 10.2s;
        --delay: -0.8s;
      }

      .sticker-star-gold {
        left: 91%;
        top: 40%;
        --w: clamp(62px, 7vw, 100px);
        --dur: 7.8s;
        --delay: -4.1s;
      }

      .sticker-dragonfly-pink {
        left: 92%;
        top: 55%;
        --w: clamp(76px, 8.5vw, 120px);
        --dur: 8.9s;
        --delay: -5s;
      }

      .sticker-heart-pink {
        left: 18%;
        top: 72%;
        --w: clamp(80px, 9vw, 130px);
        --dur: 9.8s;
        --delay: -2s;
      }

      .sticker-flower-blue {
        left: 85%;
        top: 72%;
        --w: clamp(72px, 8vw, 112px);
        --dur: 7.5s;
        --delay: -3.7s;
      }

      .sticker-butterfly-blue {
        left: 34%;
        top: 87%;
        --w: clamp(60px, 6.5vw, 95px);
        --dur: 8.2s;
        --delay: -0.4s;
      }

      .sticker-butterfly-pink-green {
        left: 62%;
        top: 88%;
        --w: clamp(80px, 9vw, 130px);
        --dur: 10.8s;
        --delay: -2.9s;
      }

      @media (max-width: 700px) {
        .sticker-heart-magenta {
          left: 10%;
          top: 8%;
          --w: 52px;
        }

        .sticker-star-pink {
          left: 38%;
          top: 6%;
          --w: 54px;
        }

        .sticker-dragonfly-pale {
          left: 84%;
          top: 8%;
          --w: 76px;
        }

        .sticker-butterfly-green {
          left: 6%;
          top: 18%;
          --w: 64px;
        }

        .sticker-star-gold {
          left: 92%;
          top: 18%;
          --w: 52px;
        }

        .sticker-dragonfly-pink {
          left: 66%;
          top: 14%;
          --w: 64px;
        }

        .sticker-heart-pink {
          left: 10%;
          top: 84%;
          --w: 64px;
        }

        .sticker-flower-blue {
          left: 88%;
          top: 84%;
          --w: 56px;
        }

        .sticker-butterfly-blue {
          left: 20%;
          top: 92%;
          --w: 54px;
        }

        .sticker-butterfly-pink-green {
          left: 70%;
          top: 93%;
          --w: 66px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .sticker img {
          animation: none;
        }
      }

      /* ÉTIQUETTES PAPIER */
      .labels {
        width: min(384px, 56vw);
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: clamp(0.4rem, 1vw, 0.8rem);
        row-gap: clamp(0.6rem, 1.6vh, 1rem);
        align-items: center;
      }

      .label-link {
        display: block;
        width: 100%;
        max-width: 186px;
        transform: rotate(var(--rot, 0deg)) scale(var(--scale, 1));
        transform-origin: 50% 50%;
        filter: drop-shadow(0 7px 11px rgba(45, 35, 45, 0.3));
        transition:
          transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
          filter 0.28s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .label-link img {
        display: block;
        width: 100%;
        height: auto;
        pointer-events: none;
      }

      .label-link:hover {
        transform: rotate(0deg) scale(calc(var(--scale, 1) * 1.045));
        filter: drop-shadow(0 14px 20px rgba(45, 35, 45, 0.38));
      }

      .label-link:active {
        transform: rotate(0deg) scale(calc(var(--scale, 1) * 0.985));
      }

      .label-instagram {
        --rot: -3deg;
        justify-self: start;
        grid-column: 1;
        grid-row: 1;
      }

      .label-spotify {
        --rot: 2.5deg;
        justify-self: end;
        grid-column: 2;
        grid-row: 1;
        margin-top: 0.6rem;
      }

      .label-youtube {
        --rot: 1.8deg;
        justify-self: center;
        grid-column: 1;
        grid-row: 2;
        margin-left: 4%;
      }

      .label-apple-music {
        --rot: -2deg;
        --scale: 1.3;
        justify-self: start;
        grid-column: 1;
        grid-row: 3;
      }

      .label-deezer {
        --rot: 2.8deg;
        justify-self: end;
        grid-column: 2;
        grid-row: 3;
        margin-top: 0.5rem;
      }

      .label-mail {
        --rot: -1.5deg;
        justify-self: end;
        grid-column: 2;
        grid-row: 2;
        margin-top: 0.6rem;
      }

      .socials {
        display: flex;
        gap: 1.5rem;
        align-items: center;
        justify-content: center;
      }
      .social-icon {
        color: #ad1457;
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        filter: drop-shadow(0 2px 4px rgba(255, 255, 255, 0.45));
        transition:
          color 0.18s ease,
          transform 0.18s ease;
      }
      .social-icon svg {
        width: 100%;
        height: 100%;
      }
      .social-icon.email-icon {
        width: 32px;
        height: 32px;
      }
      .social-icon:hover {
        color: #8e0f46;
        opacity: 0.8;
        transform: translateY(-2px);
      }

      @media (max-width: 700px) {
        .labels {
          column-gap: 0.5rem;
          row-gap: 0.9rem;
        }

        .label-spotify {
          margin-top: 0.5rem;
        }

        .label-youtube {
          margin-left: 3%;
        }

        .label-deezer {
          margin-top: 0.4rem;
        }
      }

      @media (max-width: 480px) {
        .hero {
          padding: 1.25rem;
        }

        .site-logo {
          width: min(300px, 82vw);
        }
      }
    </style>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
  </head>
  <body>
    <!-- LOGO -->
    <header class="hero">
      <span class="sticker sticker-heart-magenta" aria-hidden="true"><img src="stickers/coeur-magenta.png" alt="" /></span>
      <span class="sticker sticker-star-pink" aria-hidden="true"><img src="stickers/etoile-rose.png" alt="" /></span>
      <span class="sticker sticker-dragonfly-pale" aria-hidden="true"><img src="stickers/libellule-rose.png" alt="" /></span>
      <span class="sticker sticker-butterfly-green" aria-hidden="true"><img src="stickers/papillon-vert.png" alt="" /></span>
      <span class="sticker sticker-star-gold" aria-hidden="true"><img src="stickers/etoile-doree.png" alt="" /></span>
      <span class="sticker sticker-dragonfly-pink" aria-hidden="true"><img src="stickers/libellule-papillon.png" alt="" /></span>
      <span class="sticker sticker-heart-pink" aria-hidden="true"><img src="stickers/coeur-rose.png" alt="" /></span>
      <span class="sticker sticker-flower-blue" aria-hidden="true"><img src="stickers/fleur-bleue.png" alt="" /></span>
      <span class="sticker sticker-butterfly-blue" aria-hidden="true"><img src="stickers/papillon-bleu.png" alt="" /></span>
      <span class="sticker sticker-butterfly-pink-green" aria-hidden="true"><img src="stickers/papillon-rose-vert.png" alt="" /></span>
      <div class="hero-inner">
        <img class="site-logo" src="logo-neen.webp" alt="neen" />
        <div class="labels">
          <a
            class="label-link label-instagram"
            href="https://www.instagram.com/chloe_bastianon/?hl=fr"
            target="_blank"
            rel="noopener"
            aria-label="Instagram"
          >
            <img
              src="labels/instagram.webp?v=3"
              alt="Instagram"
              decoding="async"
            />
          </a>

          <a
            class="label-link label-spotify"
            href="https://open.spotify.com/artist/1ocUpH21N3k8H60xNWJ0OX?si=JLG39TniQGWUm19swnYseQ"
            target="_blank"
            rel="noopener"
            aria-label="Spotify"
          >
            <img
              src="labels/spotify.webp?v=3"
              alt="Spotify"
              decoding="async"
            />
          </a>

          <a
            class="label-link label-youtube"
            href="https://youtu.be/-gjMbGog5sU?si=s8XahSGEcQchLH_8"
            target="_blank"
            rel="noopener"
            aria-label="YouTube"
          >
            <img
              src="labels/youtube.webp?v=3"
              alt="YouTube"
              decoding="async"
            />
          </a>

          <a
            class="label-link label-mail"
            href="mailto:neen.musique@gmail.com"
            aria-label="Email"
          >
            <img
              src="labels/mail.webp?v=3"
              alt="Email"
              decoding="async"
            />
          </a>

          <a
            class="label-link label-apple-music"
            href="https://music.apple.com/fr/artist/neen/1894908742?l=en-GB"
            target="_blank"
            rel="noopener"
            aria-label="Apple Music"
          >
            <img
              src="labels/apple-music.webp?v=3"
              alt="Apple Music"
              decoding="async"
            />
          </a>

          <a
            class="label-link label-deezer"
            href="https://www.deezer.com/en/artist/389415161"
            target="_blank"
            rel="noopener"
            aria-label="Deezer"
          >
            <img
              src="labels/deezer.webp?v=3"
              alt="Deezer"
              decoding="async"
            />
          </a>
        </div>

      </div>
    </header>
  </body>
</html>
